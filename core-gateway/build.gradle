plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.nebula'

bootJar {
    archiveFileName = 'core-gateway.jar'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.0.3")
    // 보안 패치: Boot 기본 Tomcat/Netty보다 높은 패치 버전 강제 (Trivy CRITICAL)
    set('tomcat.version', '10.1.59')
    set('netty.version', '4.1.137.Final')
}

dependencies {
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // lombok
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // spring cloud
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-mvc'
    implementation 'org.springframework.cloud:spring-cloud-starter-kubernetes-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap'
    // implementation 'org.springframework.cloud:spring-cloud-starter-config'

    // spring security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'

    // spring redis session
    implementation 'org.springframework.session:spring-session-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // auth0 security
    // 3.0.8 = Spring Boot 3.5 대상 마지막 버전. 3.0.9+ 는 Boot 4(패키지 이동)용이라 기동 시 NoClassDefFoundError. '+' 로 되돌리지 말 것
    implementation 'com.okta.spring:okta-spring-boot-starter:3.0.8'

    // jpa
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // database
    runtimeOnly 'com.mysql:mysql-connector-j'

    // log
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    // observability: Micrometer → OpenTelemetry(OTLP) 단일 경로. 트레이스·메트릭 모두 노드의 OTel agent 로 전송
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'io.micrometer:micrometer-registry-otlp'

    // circuit breaker
    implementation 'io.github.resilience4j:resilience4j-micrometer'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    // retry
    implementation 'org.springframework.retry:spring-retry'
}

dependencyManagement {
    dependencies {
        // 보안 패치: kubernetes-client가 끌어오는 BouncyCastle 1.78 CRITICAL CVE (Trivy)
        dependency 'org.bouncycastle:bcprov-jdk18on:1.85'
        dependency 'org.bouncycastle:bcpkix-jdk18on:1.85'
        dependency 'org.bouncycastle:bcutil-jdk18on:1.85'
    }
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform {
        // 전체 인프라(Redis 클러스터, Kafka, Eureka)가 필요한 테스트는 CI 기본 실행에서 제외
        excludeTags 'integration'
    }
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
