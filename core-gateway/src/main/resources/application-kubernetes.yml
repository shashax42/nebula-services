spring:
  config:
    activate:
      on-profile: kubernetes

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    enabled: false

# JSON 로그 (Spring Boot 3.4+ 내장). MDC 의 traceId/spanId 가 포함되어 OTel agent 가 트레이스와 연결한다
logging:
  structured:
    format:
      console: logstash
