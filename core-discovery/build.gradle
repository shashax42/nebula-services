plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.nebula'

bootJar {
    archiveFileName = 'core-discovery.jar'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.0.3")
    // 보안 패치: Boot 기본 Tomcat/Netty보다 높은 패치 버전 강제 (Trivy CRITICAL)
    set('tomcat.version', '10.1.59')
    set('netty.version', '4.1.137.Final')
    set('freemarker.version', '2.3.35')  // Eureka 대시보드
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // spring cloud
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-server'

    // lombok
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    dependencies {
        // 보안 패치: kubernetes-client가 끌어오는 BouncyCastle 1.78 CRITICAL CVE (Trivy)
        dependency 'org.bouncycastle:bcprov-jdk18on:1.85'
        dependency 'org.bouncycastle:bcpkix-jdk18on:1.85'
        dependency 'org.bouncycastle:bcutil-jdk18on:1.85'
    }
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:$springCloudVersion"
    }
}

tasks.named('test') {
    useJUnitPlatform {
        // 전체 인프라(Redis 클러스터, Kafka, Eureka)가 필요한 테스트는 CI 기본 실행에서 제외
        excludeTags 'integration'
    }
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
