plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.6'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'io.nebula'

bootJar {
    archiveFileName = 'core-discovery.jar'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2023.0.4")
    // 보안 패치: Spring Boot 3.3.x 기본 Tomcat에 CRITICAL CVE (Trivy)
    set('tomcat.version', '10.1.58')
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // spring cloud
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-server'

    // lombok
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    dependencies {
        // 보안 패치: kubernetes-client가 끌어오는 BouncyCastle 1.78 CRITICAL CVE (Trivy)
        dependency 'org.bouncycastle:bcprov-jdk18on:1.85'
        dependency 'org.bouncycastle:bcpkix-jdk18on:1.85'
        dependency 'org.bouncycastle:bcutil-jdk18on:1.85'
    }
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:$springCloudVersion"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
