spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${ORDER_DB_HOST:localhost}:${ORDER_DB_PORT:3317}/${ORDER_DB_DATABASE:order}"
    username: ${ORDER_DB_USER:root}
    password: ${ORDER_DB_PASSWORD:root}
    hikari:
      # 2 미만이면 잡을 시작하지 못한다: Spring Batch 5 의 MySQL ID 증가기(MySQLMaxValueIncrementer)가
      # 잡 메타데이터 ID 를 받을 때 별도 커넥션을 하나 더 쓰므로, 1 이면 풀이 고갈돼 30초 뒤 시작 실패한다.
      maximum-pool-size: 2