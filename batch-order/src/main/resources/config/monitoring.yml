# 관측성 설정 (Nebula-Monitoring 아키텍처 기준)
#   CronJob 은 몇 초 만에 끝나므로 스크레이프(pull)로는 놓친다. 예전에는 Push Gateway 를 썼지만,
#   지금은 다른 서비스와 같은 OTLP 경로로 push 한다. 컨텍스트가 닫힐 때 OTLP 레지스트리가 마지막 값을 한 번 더 보낸다.
#   (BatchOrderApplication 이 SpringApplication.exit 로 컨텍스트를 정상 종료해야 이 flush 가 일어난다)
management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s
        resource-attributes:
          service.name: ${spring.application.name}

logging:
  level:
    root: info
