name: core-discovery
on:
  push: { branches: [main], paths: ['core-discovery/**'] }
  pull_request: { paths: ['core-discovery/**'] }
permissions: { contents: read, packages: write, id-token: write }
jobs:
  pipeline:
    uses: shashax42/nebula-ci-templates/.github/workflows/service-pipeline.yml@v1
    with: { service: core-discovery, run-tests: false }
    secrets: inherit
