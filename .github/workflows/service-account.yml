name: service-account
on:
  push: { branches: [main], paths: ['service-account/**', '.github/workflows/service-account.yml'] }
  pull_request:
permissions: { contents: read, packages: write, id-token: write }
jobs:
  service-account:
    uses: shashax42/nebula-ci-templates/.github/workflows/service-pipeline.yml@v1
    with: { service: service-account }
    secrets: inherit
